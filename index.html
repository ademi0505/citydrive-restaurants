<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City Drive | Рестораны</title>
  <style>
    :root {
      --green: #075f2d;
      --green-soft: #0b7a3a;
      --red: #d71920;
      --ink: #080a0e;
      --muted: #6b7280;
      --line: #e5e7eb;
      --bg: #f4f5f4;
      --panel: #ffffff;
      --shadow: 0 20px 60px rgba(8, 10, 14, .12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(180deg, rgba(255,255,255,.94), rgba(244,245,244,.98)),
        radial-gradient(circle at 18% 0%, rgba(7,95,45,.14), transparent 32%),
        var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
    }

    @supports (min-height: 100dvh) {
      body,
      .app {
        min-height: 100dvh;
      }
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: calc(16px + env(safe-area-inset-top, 0px)) clamp(16px, 4vw, 48px) 16px;
      background: rgba(255, 255, 255, .9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .brand-logo {
      width: min(160px, 42vw);
      height: auto;
      display: block;
    }

    .green {
      color: var(--green);
    }

    .manager-add {
      flex: 0 0 auto;
      border: 0;
      border-radius: 6px;
      padding: 12px 16px;
      color: #fff;
      background: var(--ink);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(8, 10, 14, .18);
      max-width: 100%;
      white-space: normal;
    }

    .manager-add:hover {
      background: var(--green);
    }

    .top-actions {
      display: flex;
      flex: 1 1 320px;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .manager-edit {
      flex: 0 0 auto;
      border: 0;
      border-radius: 6px;
      padding: 12px 16px;
      color: #fff;
      background: var(--green-soft);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(8, 10, 14, .14);
      max-width: 100%;
      white-space: normal;
    }

    .manager-report {
      flex: 0 0 auto;
      border: 0;
      border-radius: 6px;
      padding: 12px 16px;
      color: #fff;
      background: #2f4858;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(8, 10, 14, .14);
      max-width: 100%;
      white-space: normal;
    }

    .manager-report:hover {
      background: var(--ink);
    }

    .manager-edit.is-active {
      background: var(--red);
    }

    .hero-logo {
      width: 100%;
      padding: clamp(18px, 4vw, 34px) clamp(16px, 4vw, 48px);
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .hero-logo img {
      width: min(640px, 100%);
      height: auto;
      display: block;
      margin: 0 auto;
    }

    main {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto 48px;
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 12px 34px rgba(8, 10, 14, .08);
    }

    .search-row input {
      width: 100%;
      min-height: 48px;
      border: 2px solid var(--red);
      border-radius: 6px;
      padding: 0 14px;
      outline: none;
    }

    .search-row input:focus {
      box-shadow: 0 0 0 4px rgba(215, 25, 32, .14);
    }

    .search-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 6px;
      color: #fff;
      background: var(--red);
      font-weight: 900;
      text-transform: uppercase;
    }

    .restaurant-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 16px;
      border-radius: 6px;
      color: var(--ink);
      background: #eef1ef;
      border: 1px solid var(--line);
      font-weight: 900;
      white-space: nowrap;
    }

    .restaurants {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .connection-status {
      margin: 16px 0 0;
      padding: 12px 14px;
      border-left: 4px solid var(--red);
      background: #fff;
      color: var(--ink);
      font-weight: 700;
    }

    .restaurant {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 16px;
      border: 1px solid var(--line);
      border-left: 6px solid var(--green);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 10px 26px rgba(8, 10, 14, .06);
    }

    .restaurant h2 {
      margin: 0 0 8px;
      font-size: 20px;
      line-height: 1.2;
    }

    .restaurant a {
      color: var(--green);
      font-weight: 800;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .restaurant a:hover {
      text-decoration: underline;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .action {
      min-width: 104px;
      border: 0;
      border-radius: 6px;
      padding: 10px 12px;
      color: #fff;
      font-weight: 900;
      cursor: pointer;
    }

    .edit {
      background: var(--green-soft);
    }

    .delete {
      background: var(--red);
    }

    .empty {
      padding: 28px 16px;
      border: 1px dashed #c7cbd1;
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255,255,255,.72);
      text-align: center;
      font-weight: 700;
    }

    .dialog {
      width: min(460px, calc(100% - 28px));
      max-height: calc(100dvh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      overflow: auto;
      border: 0;
      border-radius: 8px;
      padding: 0;
      box-shadow: var(--shadow);
    }

    .dialog.is-fallback-modal[open] {
      position: fixed;
      inset: calc(16px + env(safe-area-inset-top, 0px)) 14px auto;
      z-index: 30;
      margin: 0 auto;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(8, 10, 14, .48);
    }

    .dialog::backdrop {
      background: rgba(8, 10, 14, .48);
    }

    .form {
      display: grid;
      gap: 14px;
      padding: 20px;
    }

    .form h2 {
      margin: 0;
      font-size: 22px;
    }

    .field {
      display: grid;
      gap: 6px;
      color: #313844;
      font-size: 14px;
      font-weight: 800;
    }

    .field input {
      min-height: 44px;
      border: 1px solid #cfd5dc;
      border-radius: 6px;
      padding: 0 12px;
      outline: none;
    }

    .field input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(7, 95, 45, .12);
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    .secondary,
    .primary {
      border: 0;
      border-radius: 6px;
      padding: 11px 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .secondary {
      color: var(--ink);
      background: #e8eaed;
    }

    .primary {
      color: #fff;
      background: var(--green);
    }

    .report-dialog {
      width: min(680px, calc(100% - 28px));
    }

    .report-filters {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr)) auto;
      gap: 10px;
      align-items: end;
    }

    .report-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .report-stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #f8faf9;
    }

    .report-stat strong {
      display: block;
      margin-top: 4px;
      font-size: 28px;
      color: var(--green);
    }

    .report-list {
      display: grid;
      gap: 8px;
      max-height: 300px;
      overflow: auto;
      padding-right: 4px;
    }

    .report-item {
      display: grid;
      gap: 4px;
      border: 1px solid var(--line);
      border-left: 5px solid var(--green);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
    }

    .report-item.is-deleted {
      border-left-color: var(--red);
    }

    .report-item small {
      color: var(--muted);
      font-weight: 700;
    }

    @media (max-width: 760px) {
      .topbar,
      .restaurant {
        align-items: stretch;
      }

      .topbar,
      .restaurant,
      .search-row {
        grid-template-columns: 1fr;
      }

      .topbar {
        display: grid;
      }

      .manager-add,
      .manager-edit,
      .manager-report,
      .restaurant-count,
      .search-label {
        width: 100%;
      }

      .report-filters,
      .report-summary {
        grid-template-columns: 1fr;
      }

      .top-actions {
        display: grid;
      }

      .actions {
        justify-content: stretch;
      }

      .action {
        flex: 1 1 130px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <img class="brand-logo" src="citydrive-logo-hq.png" alt="City Drive">
      <div class="top-actions">
        <button class="manager-edit" type="button" id="toggleManage">Изменить</button>
        <button class="manager-report" type="button" id="showReport">Отчет</button>
        <button class="manager-add" type="button" id="addRestaurant">+ Добавить ресторан</button>
      </div>
    </header>

    <section class="hero-logo">
      <img src="citydrive-logo-hq.png" alt="City Drive">
    </section>

    <main>
      <div class="search-row">
        <input id="searchInput" type="search" placeholder="Поиск ресторана..." autocomplete="off">
        <span class="restaurant-count" id="restaurantCount">Всего: 0</span>
        <span class="search-label">Поиск</span>
      </div>

      <p class="connection-status" id="connectionStatus" role="status" aria-live="polite" hidden></p>
      <section class="restaurants" id="restaurantList" aria-live="polite"></section>
    </main>
  </div>

  <dialog class="dialog" id="restaurantDialog">
    <form class="form" id="restaurantForm" method="dialog">
      <h2 id="dialogTitle">Добавить ресторан</h2>
      <label class="field">
        Имя ресторана
        <input id="nameInput" type="text" required maxlength="80" placeholder="Например: Burger House">
      </label>
      <label class="field">
        Ссылка 2ГИС
        <input id="linkInput" type="url" required placeholder="https://2gis.kz/...">
      </label>
      <div class="form-actions">
        <button class="secondary" type="button" id="cancelDialog">Отмена</button>
        <button class="primary" type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog report-dialog" id="reportDialog">
    <form class="form" method="dialog">
      <h2>Отчет по ресторанам</h2>
      <div class="report-filters">
        <label class="field">
          С даты
          <input id="reportFrom" type="date">
        </label>
        <label class="field">
          По дату
          <input id="reportTo" type="date">
        </label>
        <button class="primary" type="button" id="applyReport">Показать</button>
      </div>
      <div class="report-summary">
        <div class="report-stat">Добавлено<strong id="reportAdded">0</strong></div>
        <div class="report-stat">Удалено<strong id="reportDeleted">0</strong></div>
      </div>
      <div class="report-list" id="reportList"></div>
      <div class="form-actions">
        <button class="secondary" type="button" id="closeReport">Закрыть</button>
      </div>
    </form>
  </dialog>

  <script src="restaurants-data.js"></script>
  <script>
    const MANAGER_PASSWORD = 'CityDriveAstana01';
    const RESTAURANT_CACHE_KEY = 'citydrive-restaurants-cache-v1';
    const firebaseConfig = {
      apiKey: 'AIzaSyDptLjtikacZljlzH9FKI1c8eqGUcFwek4',
      authDomain: 'citydrive-restaurants.firebaseapp.com',
      projectId: 'citydrive-restaurants',
      storageBucket: 'citydrive-restaurants.firebasestorage.app',
      messagingSenderId: '22514692355',
      appId: '1:22514692355:web:8f3ab5493f775a15e7b936',
      measurementId: 'G-XJ14NSVTWD'
    };

    const seedRestaurants = window.CITYDRIVE_SEED_RESTAURANTS || [];
    const offlineRestaurants = [
      ...seedRestaurants,
      ...(window.CITYDRIVE_EXTRA_RESTAURANTS || [])
    ];
    let db;
    let restaurantsRef;
    let changesRef;
    let firebaseApp;

    const listEl = document.querySelector('#restaurantList');
    const searchInput = document.querySelector('#searchInput');
    const restaurantCount = document.querySelector('#restaurantCount');
    const addButton = document.querySelector('#addRestaurant');
    const toggleManageButton = document.querySelector('#toggleManage');
    const showReportButton = document.querySelector('#showReport');
    const connectionStatus = document.querySelector('#connectionStatus');
    const dialog = document.querySelector('#restaurantDialog');
    const form = document.querySelector('#restaurantForm');
    const dialogTitle = document.querySelector('#dialogTitle');
    const nameInput = document.querySelector('#nameInput');
    const linkInput = document.querySelector('#linkInput');
    const cancelDialog = document.querySelector('#cancelDialog');
    const reportDialog = document.querySelector('#reportDialog');
    const reportFrom = document.querySelector('#reportFrom');
    const reportTo = document.querySelector('#reportTo');
    const applyReport = document.querySelector('#applyReport');
    const closeReport = document.querySelector('#closeReport');
    const reportAdded = document.querySelector('#reportAdded');
    const reportDeleted = document.querySelector('#reportDeleted');
    const reportList = document.querySelector('#reportList');

    function readRestaurantCache() {
      try {
        const cached = JSON.parse(window.localStorage.getItem(RESTAURANT_CACHE_KEY));
        if (!Array.isArray(cached) || cached.length === 0) return null;
        if (cached.some((restaurant) => {
          return !restaurant || typeof restaurant.id !== 'string' ||
            typeof restaurant.name !== 'string' || typeof restaurant.link !== 'string';
        })) return null;
        return cached;
      } catch {
        return null;
      }
    }

    function saveRestaurantCache(items) {
      try {
        const cache = items.map(({ id, name, link }) => ({ id, name, link }));
        window.localStorage.setItem(RESTAURANT_CACHE_KEY, JSON.stringify(cache));
      } catch (error) {
        console.warn('Не удалось сохранить список ресторанов в браузере.', error);
      }
    }

    let restaurants = readRestaurantCache() || offlineRestaurants.map((restaurant, index) => ({
      id: `seed_${String(index + 1).padStart(3, '0')}`,
      ...restaurant
    }));
    let editingId = null;
    let managerMode = false;
    let seedImportStarted = false;
    let firebaseReady = false;
    let modalBackdrop = null;

    function setConnectionStatus(message) {
      connectionStatus.textContent = message;
      connectionStatus.hidden = !message;
    }

    function showFatalError(error) {
      console.error(error);
      setConnectionStatus('Произошла ошибка на странице. Показан встроенный список ресторанов.');
      renderRestaurants();
    }

    window.addEventListener('error', (event) => {
      showFatalError(event.error || event.message);
    });

    window.addEventListener('unhandledrejection', (event) => {
      showFatalError(event.reason || 'Необработанная ошибка загрузки.');
    });

    function openModal(modal, focusEl) {
      if (typeof modal.showModal === 'function') {
        modal.showModal();
      } else {
        modal.setAttribute('open', '');
        modal.classList.add('is-fallback-modal');
        if (!modalBackdrop) {
          modalBackdrop = document.createElement('div');
          modalBackdrop.className = 'modal-backdrop';
          modalBackdrop.addEventListener('click', () => closeModal(modal));
        }
        document.body.append(modalBackdrop);
      }

      if (focusEl && typeof focusEl.focus === 'function') {
        window.setTimeout(() => focusEl.focus(), 0);
      }
    }

    function closeModal(modal) {
      if (typeof modal.close === 'function') {
        modal.close();
      } else {
        modal.removeAttribute('open');
        modal.classList.remove('is-fallback-modal');
      }

      if (modalBackdrop && modalBackdrop.parentNode) {
        modalBackdrop.parentNode.removeChild(modalBackdrop);
      }
    }

    function toDateInputValue(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getChangeDate(change) {
      if (change.createdAt && typeof change.createdAt.toDate === 'function') return change.createdAt.toDate();
      if (change.createdAt) return new Date(change.createdAt);
      return null;
    }

    function formatChangeDate(date) {
      if (!date) return 'Дата не указана';
      return date.toLocaleString('ru-RU', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function getRestaurantChangeData(type, restaurant, restaurantId) {
      return {
        type,
        restaurantId,
        name: restaurant.name,
        link: restaurant.link,
        createdAt: window.firebase && window.firebase.firestore && window.firebase.firestore.FieldValue
          ? window.firebase.firestore.FieldValue.serverTimestamp()
          : new Date().toISOString()
      };
    }

    function askManagerPassword() {
      if (!firebaseReady) {
        alert('База данных пока недоступна. Просмотр списка работает, изменения временно отключены.');
        return false;
      }

      const password = prompt('Введите пароль управляющего');
      if (password === MANAGER_PASSWORD) return true;
      if (password !== null) alert('Неверный пароль');
      return false;
    }

    function openRestaurantForm(mode, restaurant = null) {
      if (!managerMode && !askManagerPassword()) return;

      editingId = restaurant ? restaurant.id : null;
      dialogTitle.textContent = mode === 'edit' ? 'Изменить ресторан' : 'Добавить ресторан';
      nameInput.value = restaurant ? restaurant.name : '';
      linkInput.value = restaurant ? restaurant.link : '';
      openModal(dialog, nameInput);
    }

    function renderRestaurants() {
      const query = searchInput.value.trim().toLowerCase();
      restaurantCount.textContent = `Всего: ${restaurants.length}`;
      const filtered = restaurants.filter((restaurant) => {
        return restaurant.name.toLowerCase().includes(query) || restaurant.link.toLowerCase().includes(query);
      });

      listEl.innerHTML = '';

      if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = query ? 'Ресторан не найден' : 'Пока ресторанов нет';
        listEl.append(empty);
        return;
      }

      filtered.forEach((restaurant) => {
        const card = document.createElement('article');
        card.className = 'restaurant';

        const info = document.createElement('div');
        const title = document.createElement('h2');
        title.textContent = restaurant.name;
        const link = document.createElement('a');
        link.href = restaurant.link;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = 'Открыть адрес в 2ГИС';
        info.append(title, link);

        card.append(info);

        if (managerMode) {
          const actions = document.createElement('div');
          actions.className = 'actions';

          const editButton = document.createElement('button');
          editButton.className = 'action edit';
          editButton.type = 'button';
          editButton.textContent = 'Изменить';
          editButton.addEventListener('click', () => openRestaurantForm('edit', restaurant));

          const deleteButton = document.createElement('button');
          deleteButton.className = 'action delete';
          deleteButton.type = 'button';
          deleteButton.textContent = 'Удалить';
          deleteButton.addEventListener('click', () => deleteRestaurant(restaurant.id));

          actions.append(editButton, deleteButton);
          card.append(actions);
        }

        listEl.append(card);
      });
    }

    async function renderReport() {
      if (!firebaseReady) {
        alert('Отчет временно недоступен без подключения к базе данных.');
        return;
      }

      reportList.innerHTML = '';
      const loading = document.createElement('div');
      loading.className = 'empty';
      loading.textContent = 'Загружаем отчет...';
      reportList.append(loading);

      const fromDate = reportFrom.value ? new Date(`${reportFrom.value}T00:00:00`) : null;
      const toDate = reportTo.value ? new Date(`${reportTo.value}T23:59:59.999`) : null;
      if (fromDate && toDate && fromDate > toDate) {
        reportAdded.textContent = '0';
        reportDeleted.textContent = '0';
        reportList.innerHTML = '';
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Выберите правильный период дат';
        reportList.append(empty);
        return;
      }

      try {
        const snapshot = await withTimeout(
          changesRef.orderBy('createdAt', 'desc').get(),
          9000,
          'Превышено время загрузки отчета.'
        );
        const changes = snapshot.docs.map((changeDoc) => ({
          id: changeDoc.id,
          ...changeDoc.data()
        })).filter((change) => {
          const date = getChangeDate(change);
          if (!date) return false;
          if (fromDate && date < fromDate) return false;
          if (toDate && date > toDate) return false;
          return true;
        });

        const added = changes.filter((change) => change.type === 'added').length;
        const deleted = changes.filter((change) => change.type === 'deleted').length;
        reportAdded.textContent = added;
        reportDeleted.textContent = deleted;
        reportList.innerHTML = '';

        if (changes.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'За выбранный период изменений нет';
          reportList.append(empty);
          return;
        }

        changes.forEach((change) => {
          const date = getChangeDate(change);
          const item = document.createElement('div');
          item.className = `report-item ${change.type === 'deleted' ? 'is-deleted' : ''}`;

          const title = document.createElement('strong');
          title.textContent = change.name || 'Без названия';

          const meta = document.createElement('small');
          meta.textContent = `${change.type === 'deleted' ? 'Удалено' : 'Добавлено'} - ${formatChangeDate(date)}`;

          item.append(title, meta);
          reportList.append(item);
        });
      } catch (error) {
        console.error(error);
        reportAdded.textContent = '0';
        reportDeleted.textContent = '0';
        reportList.innerHTML = '';
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Не удалось загрузить отчет. Проверьте настройки Firestore.';
        reportList.append(empty);
      }
    }

    function openReport() {
      if (!askManagerPassword()) return;

      const today = new Date();
      const weekAgo = new Date();
      weekAgo.setDate(today.getDate() - 7);
      reportFrom.value = toDateInputValue(weekAgo);
      reportTo.value = toDateInputValue(today);
      reportAdded.textContent = '0';
      reportDeleted.textContent = '0';
      reportList.innerHTML = '';
      openModal(reportDialog);
      renderReport();
    }

    async function deleteRestaurant(id) {
      if (!firebaseReady) {
        alert('Удаление временно недоступно без подключения к базе данных.');
        return;
      }

      if (!managerMode && !askManagerPassword()) return;
      const restaurant = restaurants.find((item) => item.id === id);
      if (!restaurant) return;
      if (!confirm(`Удалить "${restaurant.name}"?`)) return;

      try {
        const batch = db.batch();
        batch.set(changesRef.doc(), getRestaurantChangeData('deleted', restaurant, id));
        batch.delete(restaurantsRef.doc(id));
        await batch.commit();
      } catch (error) {
        console.error(error);
        alert('Не удалось удалить ресторан. Проверьте настройки Firestore.');
      }
    }

    async function importSeedRestaurants() {
      seedImportStarted = true;

      try {
        await Promise.all(seedRestaurants.map((restaurant, index) => {
          const restaurantId = `seed_${String(index + 1).padStart(3, '0')}`;
          return restaurantsRef.doc(restaurantId).set({
            ...restaurant,
            createdAt: window.firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: window.firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
        }));
      } catch (error) {
        console.error(error);
        alert('Не удалось загрузить готовый список ресторанов. Проверьте правила Firestore.');
      }
    }

    function withTimeout(promise, timeoutMs, message) {
      return new Promise((resolve, reject) => {
        const timer = window.setTimeout(() => reject(new Error(message)), timeoutMs);
        promise.then((value) => {
          window.clearTimeout(timer);
          resolve(value);
        }).catch((error) => {
          window.clearTimeout(timer);
          reject(error);
        });
      });
    }

    function loadScript(src, timeoutMs) {
      return new Promise((resolve, reject) => {
        const existing = document.querySelector(`script[src="${src}"]`);
        if (existing && existing.dataset.loaded === 'true') {
          resolve();
          return;
        }

        const script = existing || document.createElement('script');
        const timer = window.setTimeout(() => {
          script.onload = null;
          script.onerror = null;
          reject(new Error(`Не удалось загрузить ${src}`));
        }, timeoutMs);

        script.onload = () => {
          window.clearTimeout(timer);
          script.dataset.loaded = 'true';
          resolve();
        };
        script.onerror = () => {
          window.clearTimeout(timer);
          reject(new Error(`Ошибка загрузки ${src}`));
        };

        if (!existing) {
          script.src = src;
          script.async = true;
          script.crossOrigin = 'anonymous';
          document.head.append(script);
        }
      });
    }

    async function connectFirebase() {
      setConnectionStatus('Подключаемся к базе данных...');

      try {
        await withTimeout(
          loadScript('https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js', 9000),
          10000,
          'Превышено время подключения к Firebase.'
        );
        await withTimeout(
          loadScript('https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js', 9000),
          10000,
          'Превышено время подключения к Firestore.'
        );

        if (!window.firebase || !window.firebase.firestore) {
          throw new Error('Firebase SDK недоступен.');
        }

        firebaseApp = window.firebase.apps.length
          ? window.firebase.app()
          : window.firebase.initializeApp(firebaseConfig);
        db = firebaseApp.firestore();
        restaurantsRef = db.collection('restaurants');
        changesRef = db.collection('restaurant_changes');

        restaurantsRef.orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
          firebaseReady = true;
          setConnectionStatus('');
          const existingIds = new Set(snapshot.docs.map((restaurantDoc) => restaurantDoc.id));
          const hasMissingSeedRestaurants = seedRestaurants.some((restaurant, index) => {
            return !existingIds.has(`seed_${String(index + 1).padStart(3, '0')}`);
          });

          if (hasMissingSeedRestaurants && seedRestaurants.length > 0 && !seedImportStarted) {
            importSeedRestaurants();
            return;
          }

          restaurants = snapshot.docs.map((restaurantDoc) => ({
            id: restaurantDoc.id,
            ...restaurantDoc.data()
          }));
          saveRestaurantCache(restaurants);
          renderRestaurants();
        }, (error) => {
          console.error(error);
          firebaseReady = false;
          managerMode = false;
          setConnectionStatus('Нет соединения с базой: показан встроенный список, изменения временно недоступны.');
          renderRestaurants();
        });
      } catch (error) {
        console.error(error);
        firebaseReady = false;
        setConnectionStatus('Не удалось подключиться к базе: показан встроенный список, изменения временно недоступны.');
        renderRestaurants();
      }
    }

    addButton.addEventListener('click', () => openRestaurantForm('add'));
    showReportButton.addEventListener('click', openReport);
    toggleManageButton.addEventListener('click', () => {
      if (managerMode) {
        managerMode = false;
        toggleManageButton.classList.remove('is-active');
        toggleManageButton.textContent = 'Изменить';
        renderRestaurants();
        return;
      }

      if (!askManagerPassword()) return;

      managerMode = true;
      toggleManageButton.classList.add('is-active');
      toggleManageButton.textContent = 'Закрыть';
      renderRestaurants();
    });
    searchInput.addEventListener('input', renderRestaurants);
    cancelDialog.addEventListener('click', () => closeModal(dialog));
    applyReport.addEventListener('click', renderReport);
    closeReport.addEventListener('click', () => closeModal(reportDialog));

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!firebaseReady) {
        alert('Сохранение временно недоступно без подключения к базе данных.');
        return;
      }

      const restaurant = {
        name: nameInput.value.trim(),
        link: linkInput.value.trim()
      };

      if (!restaurant.name || !restaurant.link) return;

      try {
        if (editingId) {
          await restaurantsRef.doc(editingId).update({
            ...restaurant,
            updatedAt: window.firebase.firestore.FieldValue.serverTimestamp()
          });
        } else {
          const newRestaurantRef = restaurantsRef.doc();
          const batch = db.batch();
          batch.set(newRestaurantRef, {
            ...restaurant,
            createdAt: window.firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: window.firebase.firestore.FieldValue.serverTimestamp()
          });
          batch.set(changesRef.doc(), getRestaurantChangeData('added', restaurant, newRestaurantRef.id));
          await batch.commit();
        }

        closeModal(dialog);
      } catch (error) {
        console.error(error);
        alert('Не удалось сохранить ресторан. Проверьте настройки Firestore.');
      }
    });

    renderRestaurants();
    connectFirebase();
  </script>
</body>
</html>
